# 标签页图标
favicon:
  type: "image/x-icon"
  href: "/favicon.ico"

# canvas 动态背景
canvas_dust: true

# 默认颜色模式 dark / dark-only / light / light-only / auto
# dark 暗色模式
# light 亮色模式
# -only 锁定颜色模式
# auto 跟随系统
color: dark

build_time: true # 是否开启构建时间显示

# <body> 背景图片链接
background_image:
  dark: https://ak.hypergryph.com/assets/index/images/ak/pc/bk.jpg # 暗色模式
  light: /img/bk.jpg # 亮色模式

# 导航栏
menu:
  Home: ""
  About: about/
  Archives: archives/

# 侧边栏
aside:
  in_left: false # 侧边栏在左 true / false
  logo: https://ak.hypergryph.com/assets/index/images/ak/pc/faction/1.png #图片链接，建议 1:1 比例
  logo_margin: 0 # 为 Logo 图片设置 CSS margin 属性值
  logo_border_radius: 0 # 为 Logo 图片设置 CSS border-radius 属性值
  dr: / # 侧边栏 Dr. 链接
  icp: # ICP 备案号
  copyright: # 版权声明、备案号等
    # copyright:
    #   CC BY-NC-SA 4.0: https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh

# 社交链接
# 格式：链接 || 图标
# 图标支持链接与 FontAwesome
social:
  # GitHub: https://github.com/yourname || fab fa-github
  # E-Mail: mailto:yourname@gmail.com || fa fa-envelope

# post 文章页面配置；true / false
post:
  date: true # 是否显示发布日期
  updated: true # 是否显示修改日期
  excerpt: true # 是否在文章中显示摘要内容（<!-- more--> 以上的内容）
  # 文章末显示打赏二维码
  reward:
    # 支付宝 | Alipay: img/Alipay.png
    # 微信 | Wechat: img/WeChat.png
  # 以下两项依赖 hexo-wordcount
  count: true # 是否显示字数统计
  time: true # 是否显示预计阅读时长
  code_fold: 15 # 当代码小于等此行数时默认展开，设为 -1 则全部展开

# 文章内目录
toc:
  list_number: true # true / false ；是否显示编号
  max_depth: 6 # 最大目录深度
  min_depth: 1 # 最小目录深度

# 归档页
archives:
  categories_count: true # 是否显示分类总数
  tags_count: true # 是否显示标签总数

# 搜索
search:
  enable: true
  content: true # 若为 false，仅可搜索标题及 metadata
  preload: false # 自动加载搜索数据
  field: post
  format: striptags

# 背景音乐
bgm:
  enable: false
  autoplay: false
  loop: true
  src: /audio/bgm.mp3

# Vercount
vercount:
  enable: false
  sitePV: true # 站点总访问量
  siteUV: true # 站点访客数
  pagePV: true # 页面访问量

# Valine
valine:
  enable: false
  app_id: # APP ID
  app_key: # APP KEY
  server_url: # APP DOMAIN
  avatar: 'retro'
  avatar_cdn: 'https://dn-qiniu-avatar.qbox.me/avatar/'

# gitalk
gitalk:
  enable: false
  client_id: # GitHub 应用 Client ID
  client_secret: # GitHub 应用 Client Secret
  repo: # 用于存放评论数据的 GitHub 仓库
  owner: # 该 GitHub 仓库所有者
  admin: [] # 具有写该 GitHub 仓库权限的用户
  id: location.pathname

# Waline
waline:
  enable: false
  server_url: #Server_Url
  locale:
    placeholder: "期待您的评论~"

#Artalk
artalk:
  enable: false
  server: https://artalk.server.instance/
  site_name: My Blog

# Utterances
utterances:
  enable: false
  repo: # Github 仓库所有者和名称
  issue_term: pathname
  theme: github-light

# Giscus
giscus:
  enable: false
  repo: # Github 仓库所有者和名称
  repo_id: # 仓库 ID
  category: # discussion 分类名称
  category_id: # 分类 ID
  mapping: pathname
  strict: 0
  reactions_enabled: 1
  emit_metadata: 0
  input_position: bottom
  theme: preferred_color_scheme
  lang: zh-CN
  loading: lazy
  crossorigin: anonymous

# 图表支持
mermaid:
  enable: true
  version: "10.5.0"

# pjax 支持
pjax:
  enable: true

# 公式前端渲染
mathjax:
  enable: false
  version: "2.6.1"

# 在 `<head>` 标签内引入 CSS 样式表
stylesheets:

# 在 `<body>` 尾部引入 JavaScript 脚本
scripts:
